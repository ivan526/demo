<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>云端问候</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><div id="input-page" class="page active"><div class="card"><h1 class="title">云端问候</h1><p class="subtitle">输入您的姓名，获取专属问候</p><form id="greet-form"><div class="input-group"><input type="text" id="name-input" placeholder="请输入您的姓名" autocomplete="off" maxlength="50" ><div id="input-error" class="error-message"></div></div><button type="submit" id="submit-btn" class="btn"><span class="btn-text">提交</span><span class="btn-loader"></span></button></form></div></div><div id="result-page" class="page"><div class="card"><h1 class="title">问候结果</h1><div class="result-content"><div class="greeting-text" id="greeting-display"></div><div class="info-item"><span class="info-label">服务器时间：</span><span class="info-value" id="server-time"></span></div><div class="info-item"><span class="info-label">版本号：</span><span class="info-value" id="version-display"></span></div></div><button id="back-btn" class="btn btn-secondary">返回</button></div></div><div id="error-toast" class="error-toast"><span id="error-text"></span></div></div><script src="app.js"></script></body></html>
